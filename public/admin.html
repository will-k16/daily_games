<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · WK Game Suite</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/suite-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/summit.css">
<link rel="stylesheet" href="/css/admin.css">
<link rel="stylesheet" href="/css/charts.css">
<script>(function () { var h = new Date().getHours(); document.documentElement.dataset.tod = h >= 5 && h < 10 ? 'morning' : h >= 10 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'evening' : 'night'; })();</script>
</head>
<body>
<div class="app" style="max-width:1100px">
  <header class="top">
    <div class="brandrow">
      <a class="wkbadge" href="/" aria-label="WK Game Suite: all games">WK</a>
      <a class="brand" href="/"><span class="wordmark">WK Game Suite</span> <span class="badge">admin</span></a>
    </div>
    <nav class="tools">
      <a class="tbtn" href="/polly">Polly</a>
      <a class="tbtn" href="/venn">Venn</a>
      <a class="tbtn" href="/summit">Summit</a>
      <a class="tbtn" href="/">← All games</a>
    </nav>
  </header>
  <nav class="atabs" id="atabs">
    <button class="tbtn" data-t="suite">Suite</button>
    <button class="tbtn" data-t="summit">Summit <span id="sumN"></span></button>
    <button class="tbtn" data-t="polly">Polly <span id="pollyN"></span></button>
    <button class="tbtn" data-t="venn">Venn <span id="vennN"></span></button>
  </nav>
  <nav class="atabs sub" id="subtabs"></nav>
  <main id="admin"><div class="loading">Checking the keys…</div></main>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" style="max-width:680px">
    <button class="x" id="modalX" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
