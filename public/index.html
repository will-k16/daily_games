<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Right</title>
<meta name="description" content="A daily game: name something that's juuust right between too small and too big.">
<meta name="theme-color" content="#f2a93b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>
  // Set the time-of-day theme before first paint.
  (function () { var h = new Date().getHours(); document.documentElement.dataset.tod = h >= 5 && h < 10 ? 'morning' : h < 17 && h >= 10 ? 'day' : h >= 17 && h < 20 ? 'evening' : 'night'; })();
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/" aria-label="Just Right home">
      <span id="logo"></span>
      <span class="wordmark">Just <i>Right</i></span>
    </a>
    <nav class="tools" id="tools">
      <button class="tbtn admin" id="unlBtn" hidden title="Unlimited (admin only)">∞<span class="lbl">Unlimited</span></button>
      <a class="tbtn admin" id="admBtn" href="/admin.html" hidden>Admin</a>
      <button class="tbtn" id="padBtn" title="Field notebook"><span data-icon="pad"></span><span class="lbl">Notebook</span></button>
      <a class="tbtn" id="archBtn" href="#/archive" title="Archive"><span data-icon="calendar"></span><span class="lbl">Archive</span></a>
      <button class="tbtn" id="statsBtn" title="Your stats"><span data-icon="stats"></span><span class="lbl">Stats</span></button>
      <button class="tbtn" id="helpBtn" title="How to play"><span data-icon="help"></span></button>
      <button class="tbtn" id="unitBtn" title="Switch units">US</button>
      <button class="tbtn" id="acctBtn" title="Account"><span data-icon="user"></span></button>
    </nav>
  </header>

  <div class="layout">
    <main id="main"><div class="loading" id="boot">Warming up the porridge…</div></main>
    <aside class="pad" id="pad" aria-label="Field notebook"></aside>
  </div>
  <footer class="sub" style="text-align:center;margin-top:28px"><a href="/privacy.html">Privacy</a></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" id="modalX" aria-label="Close"></button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
