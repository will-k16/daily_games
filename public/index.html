<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WK Game Suite</title>
<meta name="description" content="Small daily games: Polly, Venn and Summit. New puzzles every midnight UTC.">
<meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/suite-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/suite.css">
</head>
<body>
<div class="sheet">
  <header class="masthead">
    <div class="bar">
      <span class="pill" id="bucks" title="WK Bucks"></span>
      <span class="pill" id="streak" title="Days in a row with at least one round of any game">WK streak <b>0</b></span>
      <button class="pill acct" id="acct" type="button">Sign in</button>
    </div>
    <h1 class="title" id="title" aria-label="WK GAME SUITE">WK GAME SUITE</h1>
    <p class="reset" id="reset">New puzzles in <b class="flaps" aria-live="off"><span class="sr-only" id="resetText">--:--:--</span><span class="flapset" id="flaps" aria-hidden="true"></span></b></p>
  </header>

  <main class="games" id="games"></main>

  <div class="sharebar" id="sharebar" hidden>
    <button class="btn" id="share" type="button">Share today</button>
  </div>

  <section class="similar" aria-labelledby="similarTitle">
    <h2 id="similarTitle">Similar games</h2>
    <p class="sub">Daily games by other people.</p>
    <ul class="others" id="others"></ul>
  </section>

  <aside class="tipcard" id="tipcard" hidden>
    <p>Made by one person, free, no ads.</p>
    <a class="btn alt sm" id="tipLink" href="#" target="_blank" rel="noopener">☕ Buy me a coffee</a>
  </aside>

  <div class="desk" id="desk" aria-hidden="true"></div>

  <footer class="foot"><a href="/privacy">Privacy</a><a href="#" id="tipFoot" target="_blank" rel="noopener" hidden>Buy me a coffee</a><a href="/admin" id="adminLink" hidden>Admin</a></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" id="modalX" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="wipe" aria-hidden="true"></canvas>
<script type="module" src="/js/suite.js"></script>
</body>
</html>
