<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet corner · WK Game Suite</title>
<meta name="description" content="Skipper, Mel, Polly and Race hanging out, dressed just how you left them.">
<meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/suite-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/suite.css">
</head>
<body>
<div class="sheet pets-sheet">
  <header class="pets-head">
    <div class="pets-top"><a class="back" href="/">← All games</a><span class="pill" id="bucks" title="WK Bucks"></span></div>
    <h1>Pet corner</h1>
    <p class="sub">Your four pets, dressed just how you left them. Tap one to say hi.</p>
  </header>
  <button class="helpbanner" id="helpPets" type="button">
    <span class="hb-heart" aria-hidden="true">♥</span>
    <span class="petwords"><b>Help your pets!</b><small>Meet their real-life cousins in the wild, and the people working to save them</small></span>
    <i aria-hidden="true">→</i>
  </button>
  <div class="pets-frame" id="petsHost"><div class="pets-loading">Rounding everyone up…</div></div>
  <div class="pets-shops" id="petShops" aria-label="Shops"></div>
  <div class="pets-actions">
    <button class="btn alt" id="savePic" type="button" disabled>Save picture</button>
    <span class="sub">WK Bucks from every game work in every shop.</span>
  </div>
  <footer class="foot"><a href="/">WK Game Suite</a><a href="/history">Your scores</a><a href="/privacy">Privacy</a></footer>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" id="modalX" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/pets.js"></script>
</body>
</html>
