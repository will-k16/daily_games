<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet corner · WK Game Suite</title>
<meta name="description" content="Skipper, Mel and Polly hanging out, dressed just how you left them.">
<meta name="theme-color" content="#f3eee2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/suite-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/suite.css">
</head>
<body>
<div class="sheet pets-sheet">
  <header class="pets-head">
    <a class="back" href="/">← All games</a>
    <h1>Pet corner</h1>
    <p class="sub">Your three pets, dressed just how you left them. Tap one to say hi.</p>
  </header>
  <div class="pets-frame" id="petsHost"><div class="pets-loading">Rounding everyone up…</div></div>
  <div class="pets-actions">
    <button class="btn" id="savePic" type="button" disabled>Save picture</button>
    <span class="sub">New outfits come from each game's wardrobe:
      <a href="/summit">Summit</a>, <a href="/venn">Venn</a>, <a href="/polly">Polly</a>.</span>
  </div>
  <footer class="foot"><a href="/">WK Game Suite</a><a href="/privacy">Privacy</a></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/pets.js"></script>
</body>
</html>
