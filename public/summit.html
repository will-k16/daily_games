<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Right · Summit</title>
<meta name="description" content="A daily game: ride the cable car to the thing that's juuust right between too small and too big.">
<meta name="theme-color" content="#2f5d50">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/summit.css">
<script>
  (function () { var h = new Date().getHours(); document.documentElement.dataset.tod = h >= 5 && h < 10 ? 'morning' : h >= 10 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'evening' : 'night'; })();
</script>
</head>
<body>
<div class="sky-bg" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <a class="brand" href="#/" aria-label="Just Right summit home">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M2 40 L18 14 L26 26 L32 18 L46 40Z" fill="#2f5d50"/><path d="M18 14 L13 22 L17 21 L19 24 L22 20Z" fill="#fff"/>
        <path d="M4 12 Q24 20 44 6" stroke="#3d4756" stroke-width="2" fill="none"/>
        <g class="logo-cab"><path d="M24 15 V20" stroke="#3d4756" stroke-width="2"/><rect x="17" y="20" width="14" height="11" rx="3" fill="#e4572e"/><rect x="19" y="22" width="10" height="5" rx="1.5" fill="#cfe9ff"/></g>
      </svg>
      <span class="wordmark">Just Right <small>summit</small></span>
    </a>
    <nav class="tools">
      <button class="tbtn" id="unlBtn" hidden title="Unlimited (admin)">∞</button>
      <a class="tbtn" id="admBtn" href="/admin.html" hidden title="Admin"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg><span class="lbl">Admin</span></a>
      <button class="tbtn" id="padBtn" title="Field notebook"><svg viewBox="0 0 20 20"><rect x="4" y="2.5" width="12" height="15" rx="2.5"/><path d="M7 7h6M7 10.5h6M7 14h3.5"/></svg><span class="lbl">Notebook</span></button>
      <a class="tbtn" href="#/archive" title="Archive"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2.5"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/></svg><span class="lbl">Archive</span></a>
      <button class="tbtn" id="statsBtn" title="Stats"><svg viewBox="0 0 20 20"><path d="M4 16V10M10 16V5M16 16v-8"/></svg><span class="lbl">Stats</span></button>
      <button class="tbtn" id="helpBtn" title="How to play"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 8a2.3 2.3 0 1 1 3.2 2.1c-.7.3-1 .8-1 1.5M10 14.6v.1"/></svg></button>
      <button class="tbtn" id="unitBtn" title="Switch units">US</button>
      <button class="tbtn" id="acctBtn" title="Account"><svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.5"/><path d="M3.5 17.5c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/></svg></button>
    </nav>
  </header>

  <div class="layout">
    <main id="main"><div class="loading"><div class="spinner-cab"></div>Warming up the cable car…</div></main>
    <aside class="pad" id="pad" aria-label="Field notebook"></aside>
  </div>
  <footer class="foot"><a href="/">Classic version</a> · <a href="/privacy.html">Privacy</a></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="x" id="modalX" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/js/summit.js"></script>
</body>
</html>
