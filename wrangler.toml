name = "wk-game-suite"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "just-right"
database_id = "db9dce42-dcba-4640-bee7-bdb21a26d318"
migrations_dir = "migrations"

[vars]
# First Summit puzzle day (YYYY-MM-DD, UTC). Summit #1 is this date.
LAUNCH_DATE = "2026-10-08"
# First Venn day (UTC): the day Venn is deployed. Venn #1 is this date.
VENN_LAUNCH_DATE = "2026-10-18"
# First Polly day (UTC): the day Polly is deployed. Polly #1 is this date.
POLLY_LAUNCH_DATE = "2026-10-18"
# Comma-separated Google emails that can open /admin
ADMIN_EMAILS = "will.kolander@gmail.com"
# "Buy me a coffee" link (Buy Me a Coffee, Ko-fi, PayPal.me…): shows on the home page and every game's end-of-day
# summary. Must start with https://. Leave empty to hide it everywhere.
TIP_URL = ""
